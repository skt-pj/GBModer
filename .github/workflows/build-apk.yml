name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'

      - name: Install Android SDK packages
        run: yes | sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore stable development signing key
        run: |
          mkdir -p ci
          curl -fsSL https://raw.githubusercontent.com/skt-pj/pointCloudSplating/main/ci/pointcloud-dev.jks.b64 -o ci/pointcloud-dev.jks.b64
          base64 --decode ci/pointcloud-dev.jks.b64 > ci/pointcloud-dev.jks

      - name: Apply app version
        run: |
          source version.properties
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '${VERSION_NAME}'/" app/build.gradle
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Test UI specification, renderers, and build signed debug APK
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" = "0" ]; then
            python3 tools/verify_ui_spec_v020.py
            status=$?
          fi
          echo "BUILD_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Upload versioned APK artifact
        if: env.BUILD_STATUS == '0'
        uses: actions/upload-artifact@v4
        with:
          name: GBModer-v${{ env.VERSION_NAME }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK or failure evidence into repository
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p dist
          if [ "${BUILD_STATUS:-1}" = "0" ] && [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/GBModer-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk "dist/GBModer-v${VERSION_NAME}-debug.apk"
            printf 'versionName=%s\nversionCode=%s\n' "$VERSION_NAME" "$VERSION_CODE" > dist/version.txt
            rm -f dist/build-failure.log
          else
            cp build.log dist/build-failure.log 2>/dev/null || printf 'Build failed before Gradle log was created.\n' > dist/build-failure.log
          fi
          git restore app/build.gradle || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "build v${VERSION_NAME:-unknown} debug apk"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail workflow when build or UI verification failed
        if: env.BUILD_STATUS != '0'
        run: exit 1
