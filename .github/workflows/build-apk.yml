name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable development signing key
        run: |
          mkdir -p ci
          curl -fsSL https://raw.githubusercontent.com/skt-pj/pointCloudSplating/main/ci/pointcloud-dev.jks.b64 -o ci/pointcloud-dev.jks.b64
          base64 --decode ci/pointcloud-dev.jks.b64 > ci/pointcloud-dev.jks

      - name: Apply app version
        run: |
          source version.properties
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '${VERSION_NAME}'/" app/build.gradle
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build signed debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBModer-v${{ env.VERSION_NAME }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
