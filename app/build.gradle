plugins {
    id 'com.android.application'
}

def generatedGpuSourceDir = file("$buildDir/generated/gbmoderGpu/java")
def prepareGpuSource = tasks.register('prepareGpuSource', Exec) {
    inputs.dir('src/main/java')
    inputs.file(rootProject.file('tools/prepare_gpu_source.py'))
    outputs.dir(generatedGpuSourceDir)
    commandLine 'python3',
            rootProject.file('tools/prepare_gpu_source.py').absolutePath,
            file('src/main/java').absolutePath,
            generatedGpuSourceDir.absolutePath
}

android {
    namespace 'com.sktpj.gbmoder'
    compileSdk 35

    signingConfigs {
        devStable {
            storeFile rootProject.file('ci/pointcloud-dev.jks')
            storePassword 'pointclouddev'
            keyAlias 'pointclouddev'
            keyPassword 'pointclouddev'
        }
    }

    defaultConfig {
        applicationId 'com.sktpj.gbmoder'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.devStable
        }
    }

    sourceSets {
        main {
            java.srcDirs = [generatedGpuSourceDir]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.dependsOn prepareGpuSource
    }
}
