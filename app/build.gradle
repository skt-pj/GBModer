plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def generatedGpuSourceDir = file("$buildDir/generated/gbmoderGpu/java")
def prepareGpuSource = tasks.register('prepareGpuSource', Exec) {
    inputs.dir('src/main/java')
    inputs.file(rootProject.file('tools/prepare_all_sources_v020.py'))
    inputs.file(rootProject.file('tools/prepare_gpu_source.py'))
    inputs.file(rootProject.file('tools/finish_gpu_source_v015.py'))
    inputs.file(rootProject.file('tools/finish_capture_source_v016.py'))
    inputs.file(rootProject.file('tools/finish_font_min_source_v017.py'))
    inputs.file(rootProject.file('tools/finish_font_min_source_v018.py'))
    inputs.file(rootProject.file('tools/finish_japanese_font_source_v019.py'))
    inputs.file(rootProject.file('tools/run_japanese_font_source_v019.py'))
    inputs.file(rootProject.file('tools/finish_compose_ui_source_v020.py'))
    outputs.dir(generatedGpuSourceDir)
    commandLine 'python3',
            rootProject.file('tools/prepare_all_sources_v020.py').absolutePath,
            file('src/main/java').absolutePath,
            generatedGpuSourceDir.absolutePath
}

android {
    namespace 'com.sktpj.gbmoder'
    compileSdk 37

    signingConfigs {
        devStable {
            storeFile rootProject.file('ci/pointcloud-dev.jks')
            storePassword 'pointclouddev'
            keyAlias 'pointclouddev'
            keyPassword 'pointclouddev'
        }
    }

    defaultConfig {
        applicationId 'com.sktpj.gbmoder'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.devStable
        }
    }

    sourceSets {
        main {
            java.srcDirs = [generatedGpuSourceDir]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        optIn.add('androidx.compose.material3.ExperimentalMaterial3Api')
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3.adaptive:adaptive:1.3.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}

tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.dependsOn prepareGpuSource
    }
}
