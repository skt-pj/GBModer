plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def generatedGpuSourceDir = file("$buildDir/generated/gbmoderGpu/java")
def prepareGpuSource = tasks.register('prepareGpuSource', Exec) {
    inputs.dir('src/main/java')
    inputs.file(rootProject.file('tools/prepare_all_sources_v020.py'))
    inputs.file(rootProject.file('tools/prepare_gpu_source.py'))
    inputs.file(rootProject.file('tools/finish_gpu_source_v015.py'))
    inputs.file(rootProject.file('tools/finish_capture_source_v016.py'))
    inputs.file(rootProject.file('tools/finish_font_min_source_v017.py'))
    inputs.file(rootProject.file('tools/finish_font_min_source_v018.py'))
    inputs.file(rootProject.file('tools/finish_japanese_font_source_v019.py'))
    inputs.file(rootProject.file('tools/run_japanese_font_source_v019.py'))
    inputs.file(rootProject.file('tools/finish_compose_ui_source_v020.py'))
    inputs.file(rootProject.file('tools/finish_startup_source_v021.py'))
    inputs.file(rootProject.file('tools/finish_text_route_source_v022.py'))
    inputs.file(rootProject.file('tools/finish_text_layout_source_v023.py'))
    inputs.file(rootProject.file('tools/finish_text_scroll_sync_source_v024.py'))
    inputs.file(rootProject.file('tools/finish_route_insets_source_v025.py'))
    inputs.file(rootProject.file('tools/finish_compose_controls_source_v026.py'))
    inputs.file(rootProject.file('tools/finish_icon_localization_source_v030.py'))
    inputs.file(rootProject.file('tools/finish_video_pipeline_v031.py'))
    inputs.file(rootProject.file('tools/finish_video_gpu_v032.py'))
    inputs.file(rootProject.file('tools/finish_aspect_crop_v033.py'))
    inputs.file(rootProject.file('tools/finish_billing_gate_v035.py'))
    outputs.dir(generatedGpuSourceDir)
    commandLine 'python3',
            rootProject.file('tools/prepare_all_sources_v020.py').absolutePath,
            file('src/main/java').absolutePath,
            generatedGpuSourceDir.absolutePath
}

def generatedBillingKotlinDir = file("$buildDir/generated/gbmoderBilling/kotlin")
def prepareBillingKotlin = tasks.register('prepareBillingKotlin', Exec) {
    inputs.dir('src/main/kotlin')
    inputs.file(rootProject.file('tools/prepare_billing_kotlin_v035.py'))
    outputs.dir(generatedBillingKotlinDir)
    commandLine 'python3',
            rootProject.file('tools/prepare_billing_kotlin_v035.py').absolutePath,
            file('src/main/kotlin').absolutePath,
            generatedBillingKotlinDir.absolutePath
}

android {
    namespace 'com.sktpj.gbmoder'
    compileSdk 37

    signingConfigs {
        commonStable {
            storeFile rootProject.file('ci/skt-common-signing.jks')
            storePassword '2048td-release'
            keyAlias '2048td-release'
            keyPassword '2048td-release'
        }
    }

    defaultConfig {
        applicationId 'com.sktpj.gbmoder'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.commonStable
        }
        release {
            signingConfig signingConfigs.commonStable
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            java.srcDirs = [generatedGpuSourceDir]
            kotlin.srcDirs = [generatedBillingKotlinDir]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        optIn.add('androidx.compose.material3.ExperimentalMaterial3Api')
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3.adaptive:adaptive:1.3.0'
    implementation 'com.android.billingclient:billing:9.1.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}

tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.dependsOn prepareGpuSource
        task.dependsOn prepareBillingKotlin
    }
}
