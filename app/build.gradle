plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sktpj.gbmoder'
    compileSdk 35

    signingConfigs {
        devStable {
            storeFile rootProject.file('ci/pointcloud-dev.jks')
            storePassword 'pointclouddev'
            keyAlias 'pointclouddev'
            keyPassword 'pointclouddev'
        }
    }

    defaultConfig {
        applicationId 'com.sktpj.gbmoder'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.devStable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
